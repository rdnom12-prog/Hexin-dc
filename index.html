let lang = "fr", DATA = FALLBACK, apk = "", size = "", count = 0;
try { const s = localStorage.getItem("lang"); if (s === "mg" || s === "fr") lang = s; else if (/^mg/i.test(navigator.language)) lang = "mg"; } catch (e) {}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang === "mg" ? "mg" : "fr";
  document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent = t[e.dataset.i]; });
  document.querySelectorAll(".tools button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.l === lang); });
  const dl = document.getElementById("dl");
  if (apk) { dl.href = apk; dl.style.opacity = ""; dl.style.pointerEvents = ""; document.getElementById("dlt").textContent = t.dl; }
  else { dl.removeAttribute("href"); dl.style.opacity = ".7"; dl.style.pointerEvents = "none"; document.getElementById("dlt").textContent = t.soon; }
  document.getElementById("vn").textContent = t.vn(DATA.version, DATA.taille || size, count);
  document.getElementById("rep").href = "https://wa.me/261333665708?text=" + encodeURIComponent(t.msg(DATA.version));
  const log = document.getElementById("log"); log.textContent = "";
  (DATA.historique || []).forEach(function(m){
    const d = document.createElement("div"); d.className = "ver"; d.innerHTML = "<b></b><p></p>";
    d.children[0].textContent = "Version " + m.v + ", " + m.date;
    d.children[1].textContent = m[lang] || m.fr || "";
    log.appendChild(d);
  });
  const don = document.getElementById("don"); don.textContent = "";
  DONS.forEach(function(x){
    const r = document.createElement("div"); r.className = "don";
    r.innerHTML = '<div><small></small><b></b></div><button class="pill" type="button"></button>';
    r.querySelector("small").textContent = x.nom;
    r.querySelector("b").textContent = x.num || t.nonum;
    const b = r.querySelector("button"); b.textContent = t.copy;
    if (!x.num) b.remove();
    else b.onclick = function(){
      function ok(){ b.textContent = t.copied; setTimeout(function(){ b.textContent = t.copy; }, 1500); }
      try { navigator.clipboard.writeText(x.num).then(ok, ok); } catch (e) { ok(); }
    };
    don.appendChild(r);
  });
}
function shots(){
  const c = DATA.captures || [], box = document.getElementById("shots");
  document.getElementById("apercu").hidden = !c.length;
  box.textContent = "";
  c.forEach(function(src, i){
    const f = document.createElement("figure"); f.className = "ph";
    const im = document.createElement("img"); im.src = src; im.loading = "lazy"; im.alt = "Capture " + (i + 1);
    f.appendChild(im); box.appendChild(f);
  });
}
document.querySelectorAll(".tools button").forEach(function(b){
  b.onclick = function(){ lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch (e) {} render(); };
});
if (/FBAN|FBAV|FB_IAB/i.test(navigator.userAgent)) document.getElementById("fb").style.display = "block";
render(); shots();

fetch("version.json?" + Date.now()).then(function(r){ return r.json(); }).then(function(d){
  DATA = d; apk = d.apk || ""; render(); shots(); return fetch("https://api.github.com/repos/" + REPO + "/releases");
}).catch(function(){ return fetch("https://api.github.com/repos/" + REPO + "/releases"); })
.then(function(r){ return r.json(); }).then(function(rs){
  if (!Array.isArray(rs)) return;
  rs.forEach(function(x){ (x.assets || []).forEach(function(a){ count += a.download_count || 0; }); });
  const last = rs[0] && (rs[0].assets || []).filter(function(a){ return /\.apk$/i.test(a.name); })[0];
  if (last && !apk) { apk = last.browser_download_url; size = (last.size / 1048576).toFixed(1).replace(".", ",") + " Mo"; }
  render();
}).catch(function(){});

const body = document.body, openB = document.getElementById("open");
function toggle(o){ body.classList.toggle("open", o); openB.setAttribute("aria-expanded", o); }
openB.onclick = function(){ toggle(true); };
document.getElementById("close").onclick = document.getElementById("scrim").onclick = function(){ toggle(false); };
document.querySelectorAll(".drawer a").forEach(function(a){ a.addEventListener("click", function(){ toggle(false); }); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") toggle(false); });
</script>
